name: update-characters

on:
  # schedule: # NC API가 GitHub 러너 IP를 429로 차단해 자동 스케줄 중단 (수동 트리거·로컬 갱신 사용)
  #   - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 캐릭터 데이터 갱신
        run: node scripts/fetch-characters.mjs
      - name: 변경분 커밋
        run: |
          git config user.name "hwa-forge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/characters.json
          git diff --cached --quiet || (git commit -m "chore: 캐릭터 데이터 자동 갱신" && git push)
